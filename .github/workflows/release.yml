# Publishes GameLib.exe every time something is merged into main (and when
# run by hand from the Actions tab).
#
# Each build gets its own version, v<major>.<minor>.<build number>, with the
# major and minor numbers from gamelib/Cargo.toml. The version is baked into
# the program (GAMELIB_VERSION), and the release is marked as the latest, so:
#
# - this link always downloads the newest GameLib, ready to share:
#   https://github.com/BundLibrary8/Game-Library/releases/latest/download/GameLib.exe
# - every GameLib.exe checks for a newer release when it opens, downloads
#   it, swaps it in and restarts (see gamelib/src/updates.rs).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gamelib
      - name: Work out the version
        shell: bash
        run: |
          base=$(grep -m1 '^version' gamelib/Cargo.toml | cut -d'"' -f2 | cut -d. -f1,2)
          version="$base.${GITHUB_RUN_NUMBER}"
          echo "GAMELIB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building GameLib $version"
      - name: Test
        working-directory: gamelib
        run: cargo test --release
      - name: Build
        working-directory: gamelib
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp gamelib/target/release/gamelib.exe dist/GameLib.exe
      - name: Release notes
        shell: bash
        run: |
          {
            echo "## Download"
            echo
            echo "**[GameLib.exe](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/GameLib.exe)**: open it, nothing to install. It updates itself whenever it opens."
            echo
            echo "Windows may say \"Windows protected your PC\" the first time: press **More info**, then **Run anyway**."
            echo
            echo "## What changed"
            echo
            git log -1 --format=%B "${GITHUB_SHA}"
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GAMELIB_VERSION }}
          name: GameLib ${{ env.GAMELIB_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/GameLib.exe
          body_path: notes.md
          make_latest: true
