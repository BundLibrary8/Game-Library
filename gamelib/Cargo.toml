[package]
name = "gamelib"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
egui_extras = { version = "0.37.0", features = ["image", "file"] }
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
log = "0.4.35"
pelite = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "query"] }
rfd = "0.18.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
steamlocate = "2.1.1"
sysinfo = "0.40.3"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_Bluetooth", "Win32_Foundation"] }
notify-rust = "4.19.0"
tray-icon = "0.26.1"
winreg = "0.56.0"

# Build the libraries GameLib uses with optimisation even in a normal
# `cargo run`. Our own code still compiles quickly, but image work and
# drawing run many times faster. (The first build takes a little longer.)
[profile.dev.package."*"]
opt-level = 2
