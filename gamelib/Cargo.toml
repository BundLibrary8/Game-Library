[package]
name = "gamelib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "query"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
steamlocate = "2.1.1"
sysinfo = "0.40.3"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
